apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mef
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: image-registry.openshift-image-registry.svc:5000/openshift/redis:7-el9
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mef
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
