apiVersion: apps/v1
kind: Deployment
metadata:
  name: mef-web
  namespace: mef
  labels:
    app: mef-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mef-web
  template:
    metadata:
      labels:
        app: mef-web
    spec:
      imagePullSecrets:
        - name: quay-push-secret
      containers:
        - name: mef-web
          image: quay-registry-quay-quay-enterprise.apps.bedrock.linuxera.hq/kutay.eroglu/mef-web:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: mef-web-secret
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mef-web
  namespace: mef
spec:
  selector:
    app: mef-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mef-web
  namespace: mef
spec:
  to:
    kind: Service
    name: mef-web
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
