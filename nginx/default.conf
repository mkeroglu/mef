server {
    listen 443 ssl;
    server_name meforganizasyon.com.tr www.meforganizasyon.com.tr _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # Docker's embedded DNS (127.0.0.11) re-resolves "web" on every request
    # instead of once at nginx startup — otherwise recreating the web
    # container (new deploy) leaves nginx pointed at a stale IP (502) until
    # nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://web:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
